<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Sermon Post Processor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #16213e;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 1.5rem;
      color: #e94560;
    }

    .section-label {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .file-display {
      background: #0f3460;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      word-break: break-all;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
    }

    .file-display.has-file {
      color: #eee;
      justify-content: flex-start;
    }

    .folder-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .folder-display {
      flex: 1;
      background: #0f3460;
      border-radius: 8px;
      padding: 12px 15px;
      word-break: break-all;
      color: #888;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
    }

    .folder-display.has-folder {
      color: #eee;
    }

    #outputFolderBtn {
      background: #0f3460;
      color: #eee;
      white-space: nowrap;
    }

    #outputFolderBtn:hover {
      background: #1a4a7a;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    #selectBtn {
      background: #0f3460;
      color: #eee;
    }

    #selectBtn:hover {
      background: #1a4a7a;
    }

    #convertBtn {
      background: #e94560;
      color: #fff;
    }

    #convertBtn:hover:not(:disabled) {
      background: #ff6b6b;
    }

    #convertBtn:disabled {
      background: #555;
      cursor: not-allowed;
    }

    .progress-container {
      background: #0f3460;
      border-radius: 8px;
      overflow: hidden;
      height: 24px;
      margin-bottom: 15px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      width: 0%;
      transition: width 0.3s ease;
    }

    .status {
      text-align: center;
      color: #888;
      font-size: 0.9rem;
    }

    .status.success {
      color: #4ecca3;
    }

    .status.error {
      color: #e94560;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sermon Post Processor</h1>

    <div class="section-label">Output Folder</div>
    <div class="folder-row">
      <div class="folder-display" id="folderDisplay">No folder selected</div>
      <button id="outputFolderBtn">Choose</button>
    </div>

    <div class="section-label">Video File</div>
    <div class="file-display" id="fileDisplay">No file selected</div>

    <div class="buttons">
      <button id="selectBtn">Select Video</button>
      <button id="convertBtn" disabled>Convert to 1080p</button>
    </div>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status" id="status">Select an output folder and video file to begin</div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
