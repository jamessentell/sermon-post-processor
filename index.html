<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Sermon Post Processor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #16213e;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 1.5rem;
      color: #e94560;
    }

    .section-label {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .file-display {
      background: #0f3460;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      word-break: break-all;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
    }

    .file-display.has-file {
      color: #eee;
      justify-content: flex-start;
    }

    .folder-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .folder-display {
      flex: 1;
      background: #0f3460;
      border-radius: 8px;
      padding: 12px 15px;
      word-break: break-all;
      color: #888;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
    }

    .folder-display.has-folder {
      color: #eee;
    }

    #outputFolderBtn {
      background: #0f3460;
      color: #eee;
      white-space: nowrap;
    }

    #outputFolderBtn:hover:not(:disabled) {
      background: #1a4a7a;
    }

    #outputFolderBtn:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    #selectBtn {
      background: #0f3460;
      color: #eee;
    }

    #selectBtn:hover:not(:disabled) {
      background: #1a4a7a;
    }

    #selectBtn:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
    }

    #convertBtn {
      background: #e94560;
      color: #fff;
    }

    #convertBtn:hover:not(:disabled) {
      background: #ff6b6b;
    }

    #convertBtn:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #cancelBtn {
      background: #555;
      color: #eee;
      display: none;
    }

    #cancelBtn:hover {
      background: #777;
    }

    #cancelBtn.visible {
      display: block;
    }

    .progress-container {
      background: #0f3460;
      border-radius: 8px;
      overflow: hidden;
      height: 24px;
      margin-bottom: 15px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      width: 0%;
      transition: width 0.3s ease;
    }

    .status {
      text-align: center;
      color: #888;
      font-size: 0.9rem;
    }

    .status.success {
      color: #4ecca3;
    }

    .status.error {
      color: #e94560;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f3460;
      border-radius: 8px;
      padding: 12px 15px;
      margin-bottom: 20px;
    }

    .toggle-label {
      color: #eee;
      font-size: 0.9rem;
    }

    .toggle-switch {
      position: relative;
      width: 50px;
      height: 26px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #555;
      transition: 0.3s;
      border-radius: 26px;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: #eee;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .toggle-slider {
      background-color: #4ecca3;
    }

    input:checked + .toggle-slider:before {
      transform: translateX(24px);
    }

    .usb-status {
      font-size: 0.75rem;
      color: #888;
      margin-left: 10px;
    }

    .usb-status.active {
      color: #4ecca3;
    }

    .usb-status.detected {
      color: #e94560;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sermon Post Processor</h1>

    <div class="toggle-row">
      <div>
        <span class="toggle-label">Auto-detect camera USB</span>
        <span class="usb-status" id="usbStatus"></span>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="usbToggle">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="section-label">Output Folder</div>
    <div class="folder-row">
      <div class="folder-display" id="folderDisplay">No folder selected</div>
      <button id="outputFolderBtn">Choose</button>
    </div>

    <div class="section-label">Video File</div>
    <div class="file-display" id="fileDisplay">No file selected</div>

    <div class="buttons">
      <button id="selectBtn">Select Video</button>
      <button id="convertBtn" disabled>Convert to 1080p</button>
      <button id="cancelBtn">Cancel</button>
    </div>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status" id="status">Select an output folder and video file to begin</div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
